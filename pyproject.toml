[project]
name = "pyfmcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "basedpyright>=1.39.9",
    "fastmcp>=3.4.5",
    "msgspec[yaml]>=0.21.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "structconfig>=0.1.0",
]

[project.scripts]
pyfmcp = "pyfmcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfmcp"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest-asyncio>=1.4.0",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
# log_cli = true
# log_cli_level = "INFO"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "I", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
failOnWarnings = false
reportUnusedCallResult = "hint"
